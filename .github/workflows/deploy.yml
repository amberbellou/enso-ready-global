name: Build and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 15 * *"   # monthly, the 15th: after CPC's second-Thursday ENSO update
    - cron: "23 7 * * 5"    # weekly, Fridays: current conditions (CHIRPS recent rain, US Drought Monitor released Thursdays)
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Refresh ENSO status (dead-man's switch keeps last-good on failure)
        timeout-minutes: 5
        run: |
          node scripts/ingest-enso-status.js > /tmp/status.log 2>&1 || { cat /tmp/status.log; echo "::warning::status ingest failed; serving last-good enso_status.json"; }
      - name: Set up Python
        uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install data-pipeline dependencies and audit them
        timeout-minutes: 10
        run: |
          python -m pip install -q numpy netCDF4 shapely pip-audit
          pip-audit --progress-spinner off || echo "::warning::pip-audit reported issues"
      - name: Refresh current conditions (weekly layer; keep last-good on failure)
        timeout-minutes: 20
        run: |
          python scripts/ingest-conditions.py > /tmp/cond.log 2>&1 || { cat /tmp/cond.log; echo "::warning::conditions ingest failed; serving last-good conditions.json"; }
          python scripts/ingest-inform.py > /tmp/inform.log 2>&1 || { cat /tmp/inform.log; echo "::warning::INFORM ingest failed; serving last-good inform.json"; }
      - name: Run tests
        timeout-minutes: 5
        run: node --test "tests/*.test.js"
      - name: Editorial lint (STYLE.md rules)
        timeout-minutes: 2
        run: node scripts/editorial-lint.js
      - name: Country list for the no-JS pages (GeoNames countryInfo, CC BY 4.0)
        timeout-minutes: 5
        run: |
          mkdir -p data/raw site/geo
          curl -sSf -o data/raw/countryInfo.txt https://download.geonames.org/export/dump/countryInfo.txt
          python3 - <<'PY'
          import json
          c = {}
          for line in open("data/raw/countryInfo.txt", encoding="utf-8"):
              if line.startswith("#") or not line.strip(): continue
              p = line.split("\t"); c[p[0]] = {"name": p[4], "continent": p[8], "languages": p[15], "capital": p[5]}
          json.dump(c, open("site/geo/countries.json", "w"), ensure_ascii=False)
          PY
      - name: Build site
        timeout-minutes: 15
        run: node scripts/build-site.js > /tmp/build.log 2>&1 || { cat /tmp/build.log; exit 1; }
      - name: Third-party host check (no external scripts, styles, fonts or trackers)
        run: node scripts/check-third-parties.js
      - name: Freshness monitor (dead-man's switch)
        id: fresh
        continue-on-error: true
        run: node scripts/freshness-check.js
      - name: Source link check (report only)
        timeout-minutes: 10
        continue-on-error: true
        run: node scripts/check-links.js
      - name: Alert on stale data
        if: steps.fresh.outcome == 'failure'
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh issue list -R "${{ github.repository }}" --label stale-data --state open --json number --jq 'length' | grep -q '^0$' && \
          gh issue create -R "${{ github.repository }}" --title "Stale data: a live layer is older than its freshness threshold" --label stale-data --body "The freshness monitor failed in run ${{ github.run_id }}. See site/data/freshness.json in the deployed site and the workflow log." || true
      - name: Commit refreshed status (traceability)
        if: github.event_name != 'push'
        run: |
          git config user.name "enso-ready-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/derived/enso_status.json data/derived/conditions.json data/derived/inform.json
          git diff --cached --quiet || git commit -m "chore: monthly ENSO status refresh" && git push
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
