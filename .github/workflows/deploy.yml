name: Build and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 15 * *"   # monthly, the 15th: after CPC's second-Thursday ENSO update
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Refresh ENSO status (dead-man's switch keeps last-good on failure)
        run: |
          node scripts/ingest-enso-status.js || echo "::warning::status ingest failed; serving last-good enso_status.json"
      - name: Run tests
        run: node --test tests/
      - name: Fetch GeoNames and build gazetteer
        run: |
          mkdir -p data/raw
          bash scripts/fetch-geonames.sh
          python3 scripts/build_gazetteer.py
      - name: Build site
        run: node scripts/build-site.js
      - name: Commit refreshed status (traceability)
        if: github.event_name != 'push'
        run: |
          git config user.name "enso-ready-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/derived/enso_status.json
          git diff --cached --quiet || git commit -m "chore: monthly ENSO status refresh" && git push
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
